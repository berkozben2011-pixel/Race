<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#10151d"><title>Turbo Pist — Araba Yarışı</title>
<style>
:root{color-scheme:dark;--bg:#10151d;--panel:#18212b;--lime:#c9ff3b;--muted:#9aa8b8}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}#game{display:block;width:100vw;height:100dvh;background:#152c28}.hud{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 12px);display:flex;flex-direction:column;justify-content:space-between}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.brand,.stat{background:#101720d9;border:1px solid #ffffff20;backdrop-filter:blur(8px);border-radius:14px;padding:10px 13px;box-shadow:0 8px 30px #0002}.brand strong{font-size:14px;letter-spacing:1.8px}.brand small{display:block;color:var(--lime);font-size:10px;letter-spacing:2px;margin-top:3px}.stats{display:flex;gap:7px}.stat{text-align:center;min-width:66px;padding:8px 10px}.stat span{display:block;font-size:9px;color:var(--muted);letter-spacing:1px}.stat b{font-size:18px;font-variant-numeric:tabular-nums}.stat b em{font-style:normal;font-size:10px;color:var(--lime)}.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.steering{display:flex;gap:9px;pointer-events:auto}.control{border:1px solid #ffffff35;background:#111923d9;color:#fff;width:68px;height:66px;border-radius:18px;font-size:24px;font-weight:800;box-shadow:0 5px 0 #0005;touch-action:none;user-select:none;-webkit-user-select:none}.control:active,.control.pressed{background:var(--lime);color:#111923;transform:translateY(3px);box-shadow:0 2px 0 #0005}.pedals{display:flex;gap:8px;pointer-events:auto}.pedals .control{width:68px;height:58px;font-size:11px;letter-spacing:1px}.gas{background:#c9ff3b;color:#121a1f;border-color:#e4ff9a}.brake{background:#e54d5d;color:white}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#0a1119a8,#0a1119d9);padding:22px;z-index:4}.card{width:min(440px,100%);padding:27px 23px;border:1px solid #ffffff24;border-radius:25px;background:linear-gradient(145deg,#202c38f5,#101720f5);box-shadow:0 25px 80px #0008;text-align:center}.eyebrow{font-size:10px;letter-spacing:3px;color:var(--lime);font-weight:800}.card h1{font-size:clamp(32px,9vw,48px);line-height:.95;letter-spacing:-2px;margin:13px 0}.card p{color:#bdc7d1;font-size:14px;line-height:1.6;margin:13px 0 20px}.primary{width:100%;border:0;border-radius:13px;padding:16px;background:var(--lime);color:#111820;font-size:15px;font-weight:900;letter-spacing:1px}.secondary{margin-top:10px;width:100%;border:1px solid #ffffff25;border-radius:13px;padding:13px;background:#ffffff0a;color:white;font-weight:700}.tips{font-size:11px!important;color:#8292a4!important;margin-bottom:0!important}.hide{display:none!important}.toast{position:fixed;top:26%;left:50%;transform:translate(-50%,-50%);background:#101720e8;border:1px solid #ffffff25;border-radius:14px;padding:12px 18px;font-size:13px;z-index:3;pointer-events:none;white-space:nowrap}.mobile-note{font-size:10px;color:#718091;margin-top:15px}
.garage{place-items:end center;background:linear-gradient(#0a111900 24%,#0a1119f2 62%);padding:0 14px calc(env(safe-area-inset-bottom) + 14px)}.gcard{width:min(460px,100%);padding:15px 15px 13px;border:1px solid #ffffff24;border-radius:22px;background:linear-gradient(145deg,#202c38f5,#101720f5);box-shadow:0 25px 80px #0008;text-align:center}.carrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 12px}.arrow{width:54px;height:54px;border-radius:16px;border:1px solid #ffffff35;background:#111923d9;color:#fff;font-size:22px;font-weight:800;box-shadow:0 4px 0 #0005;touch-action:manipulation}.arrow:active{background:var(--lime);color:#111923;transform:translateY(2px)}.cname{font-size:22px;font-weight:900;letter-spacing:1px}.cname small{display:block;color:var(--lime);font-size:10px;letter-spacing:3px;margin-top:3px}.dots{display:flex;gap:6px;justify-content:center;margin-top:7px}.dots i{width:7px;height:7px;border-radius:50%;background:#ffffff30}.dots i.on{background:var(--lime)}.drivers{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:8px 0 12px}.drv{border:1px solid #ffffff25;background:#ffffff0a;border-radius:14px;padding:7px 2px 6px;color:#fff;font-size:11px;font-weight:700;touch-action:manipulation}.drv.on{border-color:var(--lime);background:#c9ff3b22}.av{width:38px;height:38px;border-radius:50%;margin:0 auto 4px;background:#2a3846 center/cover no-repeat;display:grid;place-items:center;font-size:15px;font-weight:900;color:var(--lime)}.grow{display:flex;gap:8px}.grow .secondary{margin-top:0;width:34%}.grow .primary{width:66%}body.garage-open .hud{opacity:0}.hud{transition:opacity .2s}
@media(min-width:760px){.control{width:76px;height:72px}.pedals .control{width:84px;height:66px}.hud{padding:20px 24px}.brand strong{font-size:16px}}
</style></head>
<body><canvas id="game" aria-label="Araba yarışı oyunu"></canvas>
<div class="hud"><div class="top"><div class="brand"><strong>TURBO PİST</strong><small>ARCADE RACING / 01</small></div><div class="stats"><div class="stat"><span>HIZ</span><b id="speed">0 <em>KM/H</em></b></div><div class="stat"><span>TUR</span><b id="lap">1/3</b></div><div class="stat"><span>ZAMAN</span><b id="time">00:00</b></div></div></div><div class="bottom"><div class="steering"><button class="control" data-control="left" aria-label="Sola dön">◀</button><button class="control" data-control="right" aria-label="Sağa dön">▶</button></div><div class="pedals"><button class="control brake" data-control="brake">FREN</button><button class="control gas" data-control="gas">GAZ ▲</button></div></div></div>
<div id="start" class="overlay"><div class="card"><div class="eyebrow">MOTORLAR HAZIR MI?</div><h1>TURBO<br><span style="color:var(--lime)">PİST</span></h1><p>Virajlara dikkat et, rakiplerini geç ve damalı bayrağa ilk ulaşan sen ol.</p><button id="startBtn" class="primary">YARIŞI BAŞLAT →</button><button id="howBtn" class="secondary">NASIL OYNANIR?</button><p class="tips">TELEFONDA DOKUNMATİK • BİLGİSAYARDA OK TUŞLARI</p></div></div>
<div id="garage" class="overlay garage hide"><div class="gcard"><div class="eyebrow">GARAJ</div><div class="carrow"><button class="arrow" id="prevCar" aria-label="Önceki araç">◀</button><div><div class="cname" id="carName">SARI<small>ŞİMŞEK</small></div><div class="dots" id="carDots"></div></div><button class="arrow" id="nextCar" aria-label="Sonraki araç">▶</button></div><div class="eyebrow">PİLOT SEÇ</div><div class="drivers" id="drivers"></div><div class="grow"><button id="backBtn" class="secondary">GERİ</button><button id="goBtn" class="primary">YARIŞA BAŞLA →</button></div></div></div>
<div id="finish" class="overlay hide"><div class="card"><div class="eyebrow">DAMALI BAYRAK</div><h1 id="finishTitle">YARIŞ<br><span style="color:var(--lime)">BİTTİ!</span></h1><p id="finishText">Güzel sürüş!</p><button id="againBtn" class="primary">TEKRAR YARIŞ →</button><button id="garageBtn" class="secondary">ARAÇ / PİLOT DEĞİŞTİR</button></div></div><div id="toast" class="toast hide"></div>
<script src="js/turbo3d.js"></script>
<script>
(()=>{'use strict';
let canvas=document.getElementById('game'),ctx=null,r3d=null;
const keys={left:false,right:false,gas:false,brake:false};let W=0,H=0,dpr=1;
let running=false,finished=false,speed=0,steer=0,roadOffset=0,elapsed=0,last=0,lap=1,playerX=0,shake=0,toastTimer=0,hitCool=0,passes=0,accel=0,idleT=0;
let rivals=[];let garageOpen=false,gAngle=2.5,li=0;const passedNames=new Set();const $=id=>document.getElementById(id);
const WPO=0.0275;            // roadOffset -> 3D dünya birimi
const MAXV=230;
// ---- Render seçimi: önce WebGL/Three.js, olmazsa özgün 2D canvas ----
try{ if(window.Turbo3D) r3d=window.Turbo3D.create(canvas); }catch(e){ console.warn('3D başlatılamadı, 2D moda geçildi:',e); r3d=null; }
if(!r3d){ ctx=canvas.getContext('2d'); if(!ctx){ const c2=canvas.cloneNode(false); canvas.replaceWith(c2); canvas=c2; ctx=canvas.getContext('2d'); } }
else r3d.onStatus(info=>{ if(info.failed>0){ console.warn('Bazı GLB modelleri yüklenemedi, yedek araç kullanılıyor:',info); showToast(info.loaded?'Bazı araçlar yedek modelle':'Yedek araç modeli kullanılıyor'); } });
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 if(r3d){r3d.resize(W,H,dpr)}else{canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
 if(!running)renderIdle()}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,150));
const CARS=[{n:'SARI',t:'DOBLO',hex:'#f2c230'},{n:'KIRMIZI',t:'ALEV',hex:'#e0553f'},{n:'MAVİ',t:'TOFAŞ',hex:'#2f6fd0'},{n:'MOR',t:'GECE',hex:'#8b57c9'}];
const DRIVERS=[{n:'Berk',s:'berk'},{n:'Yankı',s:'yanki'},{n:'Rüzgar',s:'ruzgar'},{n:'Ahmet',s:'ahmet'},{n:'Sinan',s:'sinan'},{n:'Koray',s:'koray'},{n:'Kaan',s:'kaan'},{n:'Çiğdem',s:'cigdem'}];
let sel={car:0,driver:0};try{const j=JSON.parse(localStorage.getItem('turbopist_sel')||'null');if(j&&j.car>=0&&j.car<CARS.length&&j.driver>=0&&j.driver<DRIVERS.length)sel=j}catch(e){}
const saveSel=()=>{try{localStorage.setItem('turbopist_sel',JSON.stringify(sel))}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const otherCars=()=>[0,1,2,3].filter(i=>i!==sel.car);
function newRivals(){const oc=shuffle(otherCars()),od=shuffle(DRIVERS.map((_,i)=>i).filter(i=>i!==sel.driver));const base=[{x:-.42,rel:14,s:.73},{x:.38,rel:28,s:.82},{x:.05,rel:42,s:.66}];return base.map((b,i)=>({...b,c:CARS[oc[i]].hex,car:oc[i],name:DRIVERS[od[i]].n,v:0,ph:i,passed:false}))}
function applyCars(rv){if(r3d)r3d.setCars([sel.car,...rv.map(v=>v.car)])}
// ---- Garaj ekranı ----
let drvBuilt=false;
function tryPhoto(el,slug){const ex=['jpg','jpeg','png','webp'];let i=0;const im=new Image();im.onload=()=>{el.style.backgroundImage='url('+im.src+')';el.textContent=''};im.onerror=()=>{if(++i<ex.length)im.src=slug+'.'+ex[i]};im.src=slug+'.'+ex[0]}
function buildDrivers(){if(drvBuilt)return;drvBuilt=true;const box=$('drivers');DRIVERS.forEach((d,i)=>{const b=document.createElement('button');b.className='drv';b.type='button';const av=document.createElement('div');av.className='av';av.textContent=d.n[0];b.appendChild(av);b.appendChild(document.createTextNode(d.n));b.addEventListener('click',()=>{sel.driver=i;saveSel();refreshGarage()});box.appendChild(b);tryPhoto(av,d.s)});
 const dots=$('carDots');CARS.forEach(()=>dots.appendChild(document.createElement('i')))}
function refreshGarage(){const c=CARS[sel.car];$('carName').innerHTML=c.n+'<small>'+c.t+'</small>';document.querySelectorAll('#carDots i').forEach((e,i)=>e.classList.toggle('on',i===sel.car));document.querySelectorAll('.drv').forEach((e,i)=>e.classList.toggle('on',i===sel.driver));applyCars(newRivals())}
function changeCar(d){sel.car=(sel.car+d+CARS.length)%CARS.length;saveSel();refreshGarage()}
function openGarage(){buildDrivers();$('start').classList.add('hide');$('finish').classList.add('hide');$('garage').classList.remove('hide');garageOpen=true;document.body.classList.add('garage-open');refreshGarage();startIdle()}
function closeGarage(){garageOpen=false;document.body.classList.remove('garage-open');$('garage').classList.add('hide')}

function reset(){closeGarage();passedNames.clear();running=true;finished=false;speed=0;steer=0;roadOffset=0;elapsed=0;lap=1;playerX=0;shake=0;hitCool=0;passes=0;accel=0;rivals=newRivals();applyCars(rivals);$('start').classList.add('hide');$('finish').classList.add('hide');last=performance.now();requestAnimationFrame(loop)}
// ---- Özgün 2D çizim (WebGL yoksa yedek) ----
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function car(x,y,w,h,color,player=false){ctx.save();ctx.translate(x,y);ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(0,h*.34,w*.62,h*.18,0,0,Math.PI*2);ctx.fill();rounded(-w*.54,-h*.25,w*.18,h*.32,3,'#15191d');rounded(w*.36,-h*.25,w*.18,h*.32,3,'#15191d');rounded(-w*.54,h*.05,w*.18,h*.32,3,'#15191d');rounded(w*.36,h*.05,w*.18,h*.32,3,'#15191d');rounded(-w*.43,-h*.5,w*.86,h,Math.max(5,w*.18),color);rounded(-w*.31,-h*.27,w*.62,h*.34,Math.max(4,w*.1),'#b6d9e5');rounded(-w*.28,-h*.23,w*.56,h*.23,3,'#1c3545');rounded(-w*.32,h*.2,w*.64,h*.15,3,player?'#f3f4f5':'#ffffff88');rounded(-w*.34,-h*.45,w*.22,h*.09,2,'#f7f2c2');rounded(w*.12,-h*.45,w*.22,h*.09,2,'#f7f2c2');if(player){ctx.fillStyle='#111';ctx.font=`bold ${Math.max(8,w*.24)}px system-ui`;ctx.textAlign='center';ctx.fillText('10',0,h*.12)}ctx.restore()}
function road(){const horizon=H*.26,base=H*1.04;ctx.fillStyle='#6a9d52';ctx.fillRect(0,0,W,H);
let stripe=(roadOffset*.25)%90;for(let y=-90+stripe;y<H;y+=90){ctx.fillStyle='#ffffff08';ctx.fillRect(0,y,W,42)}
ctx.fillStyle='#1b453b';for(let i=0;i<15;i++){let x=((i*137-roadOffset*.07)%(W+100)+W+100)%(W+100)-50;let h=35+(i*19)%60;ctx.beginPath();ctx.moveTo(x,horizon+15);ctx.lineTo(x-22,horizon+15+h);ctx.lineTo(x+22,horizon+15+h);ctx.fill()}
const curve=Math.sin(roadOffset*.0014)*W*.09;const leftTop=W*.39+curve*.25,rightTop=W*.61+curve*.25,leftBot=-W*.12+curve,rightBot=W*1.12+curve;
ctx.fillStyle='#626a70';ctx.beginPath();ctx.moveTo(leftTop-4,horizon);ctx.lineTo(rightTop+4,horizon);ctx.lineTo(rightBot+14,base);ctx.lineTo(leftBot-14,base);ctx.closePath();ctx.fill();ctx.fillStyle='#292e34';ctx.beginPath();ctx.moveTo(leftTop,horizon);ctx.lineTo(rightTop,horizon);ctx.lineTo(rightBot,base);ctx.lineTo(leftBot,base);ctx.closePath();ctx.fill();
for(let i=0;i<18;i++){let t=((i/18+((roadOffset*.002)%1))%1);let y=horizon+(base-horizon)*t;let l=leftTop+(leftBot-leftTop)*t+curve*(t*t-t*.25),r=rightTop+(rightBot-rightTop)*t+curve*(t*t-t*.25);let hh=2+t*11;ctx.fillStyle=i%2?'#f1f0e8':'#e64e55';ctx.fillRect(l-5-t*5,y,5+t*5,hh);ctx.fillRect(r,y,5+t*5,hh)}
for(let i=0;i<12;i++){let t=((i/12+(roadOffset*.0018%1))%1);let y=horizon+(base-horizon)*t;let l=leftTop+(leftBot-leftTop)*t+curve*(t*t-t*.25),r=rightTop+(rightBot-rightTop)*t+curve*(t*t-t*.25);let ww=(r-l)*.012;ctx.fillStyle='#e8e7d5';ctx.fillRect(l+(r-l)/3-ww/2,y,ww,4+t*22);ctx.fillRect(l+2*(r-l)/3-ww/2,y,ww,4+t*22)}
return {horizon,base,leftTop,rightTop,leftBot,rightBot,curve}}
function draw2d(){ctx.clearRect(0,0,W,H);const r=road();
rivals.forEach(v=>{let t=Math.max(.05,Math.min(1.12,.92-v.rel/130));let y=r.horizon+(r.base-r.horizon)*t;let left=r.leftTop+(r.leftBot-r.leftTop)*t+r.curve*(t*t-t*.25),right=r.rightTop+(r.rightBot-r.rightTop)*t+r.curve*(t*t-t*.25);let x=left+(right-left)*(.5+v.x*.42);let cw=13+t*37,ch=23+t*62;if(v.rel>-12&&v.rel<130)car(x,y-ch*.48,cw,ch,v.c,false)});
let px=W*.5+playerX*W*.29;let py=H*.81;car(px,py,Math.max(36,W*.105),Math.max(65,H*.14),CARS[sel.car].hex,true);
const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#06121a55');g.addColorStop(.3,'#0000');g.addColorStop(1,'#06100d33');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function drawGarage2d(){ctx.clearRect(0,0,W,H);road();car(W*.5,H*.3,Math.min(W*.34,170),Math.min(W*.58,300),CARS[sel.car].hex,true)}
function render(dt){
 if(garageOpen){gAngle+=dt*.6;if(r3d)r3d.render({dt,garage:{angle:gAngle}});else drawGarage2d();return}
 if(r3d)r3d.render({dt,dist:roadOffset*WPO,speed,steer,playerX,shake,accel,rivals});
 else draw2d()}
// Başlangıç/bitiş ekranı arkasında sahneyi (düşük hızda) canlı tut
function renderIdle(){ if(!running) render(0.016) }
let idleOn=false;function startIdle(){if(!idleOn){idleOn=true;requestAnimationFrame(idleLoop)}}
function idleLoop(now){ if(running){idleOn=false;return} const dt=Math.min((now-li)/1000,.05)||.016;li=now; if(garageOpen||now-idleT>100){idleT=now;render(garageOpen?dt:.016)} requestAnimationFrame(idleLoop) }
// ---- Oyun döngüsü (fizik değerleri özgün sürümle aynı) ----
function loop(now){if(!running)return;let dt=Math.min((now-last)/1000,.04);last=now;
 const prevSpeed=speed;
 if(keys.gas)speed=Math.min(MAXV,speed+105*dt);else speed=Math.max(0,speed-29*dt);if(keys.brake)speed=Math.max(0,speed-190*dt);
 accel+=((speed-prevSpeed)/Math.max(dt,.001)/105-accel)*Math.min(1,dt*6);
 let turn=(keys.right?1:0)-(keys.left?1:0);steer+=(turn-steer)*Math.min(1,dt*7);playerX+=steer*dt*(.42+speed/320);playerX=Math.max(-1.12,Math.min(1.12,playerX));
 if(Math.abs(playerX)>.9){speed=Math.max(45,speed-80*dt);shake=4}else shake=Math.max(0,shake-20*dt);
 roadOffset+=speed*dt*8;elapsed+=dt;hitCool=Math.max(0,hitCool-dt);
 // rakipler: kendi hızlarıyla gerçek konumda ilerler, geçilince ileride yeniden doğar
 const pv=speed*8*WPO,ramp=Math.min(1,elapsed/5);
 rivals.forEach((v,i)=>{v.v=v.s*MAXV*8*WPO*ramp;v.rel+=(v.v-pv)*dt;v.ph+=dt;v.x=Math.max(-.85,Math.min(.85,v.x+Math.sin(v.ph*.7+i)*dt*.05));
  if(!v.passed&&v.rel<-3){v.passed=true;passes++;passedNames.add(v.name);showToast(v.name+' geçildi!')}
  if(v.rel<-30){v.rel=160+Math.random()*80;v.x=(Math.random()-.5)*1.5;v.passed=false}
  if(hitCool<=0&&Math.abs(v.rel)<4.2&&Math.abs(playerX-v.x)*5<2.2){const sg=playerX>=v.x?1:-1;speed=Math.max(30,speed*.55);shake=6;hitCool=1;playerX=Math.max(-1.12,Math.min(1.12,playerX+sg*.12));v.x-=sg*.1;if(v.rel>0)v.rel+=1.5;showToast('ÇARPIŞMA!')}});
 const newLap=Math.floor(elapsed/24)+1;if(elapsed>0&&newLap>lap){lap=Math.min(3,newLap);if(lap<=3&&elapsed<71)showToast('TUR '+lap+'/3')}
 $('speed').innerHTML=Math.round(speed)+' <em>KM/H</em>';$('lap').textContent=Math.min(lap,3)+'/3';$('time').textContent=fmt(elapsed);
 render(dt);
 if(elapsed>=72){endRace();return}requestAnimationFrame(loop)}
function fmt(t){let m=Math.floor(t/60),s=Math.floor(t%60);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function endRace(){running=false;finished=true;$('finishTitle').innerHTML='YARIŞ<br><span style="color:var(--lime)">BİTTİ!</span>';$('finishText').textContent=DRIVERS[sel.driver].n+' • Süren: '+fmt(elapsed)+' • Geçilen rakip: '+passes+(passedNames.size?' ('+[...passedNames].join(', ')+')':'')+' • Bir tur daha atmaya hazır mısın?';$('finish').classList.remove('hide');startIdle()}
function showToast(text){$('toast').textContent=text;$('toast').classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hide'),2600)}
// ---- Kontroller (özgün sürümle aynı) ----
document.querySelectorAll('[data-control]').forEach(btn=>{const k=btn.dataset.control;const down=e=>{e.preventDefault();keys[k]=true;btn.classList.add('pressed')},up=e=>{e.preventDefault();keys[k]=false;btn.classList.remove('pressed')};btn.addEventListener('pointerdown',down);btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up);btn.addEventListener('pointerleave',up)});
const keyMap={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'gas',w:'gas',ArrowDown:'brake',s:'brake',' ':'brake'};
addEventListener('keydown',e=>{let k=keyMap[e.key];if(k){keys[k]=true;e.preventDefault()}if(garageOpen&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){changeCar(e.key==='ArrowLeft'?-1:1)}if(e.key==='Enter'&&!running){if(garageOpen||!$('finish').classList.contains('hide'))reset();else openGarage()}});addEventListener('keyup',e=>{if(keyMap[e.key])keys[keyMap[e.key]]=false});
const releaseAll=()=>{Object.keys(keys).forEach(k=>keys[k]=false);document.querySelectorAll('.control.pressed').forEach(b=>b.classList.remove('pressed'))};
addEventListener('blur',releaseAll);document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll()});
// iOS Safari: çift dokunma/sıkıştırma yakınlaştırmasını ve uzun basma menüsünü engelle
['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));
document.addEventListener('contextmenu',e=>e.preventDefault());
$('startBtn').addEventListener('click',openGarage);$('againBtn').addEventListener('click',reset);$('garageBtn').addEventListener('click',openGarage);$('goBtn').addEventListener('click',reset);$('prevCar').addEventListener('click',()=>changeCar(-1));$('nextCar').addEventListener('click',()=>changeCar(1));$('backBtn').addEventListener('click',()=>{closeGarage();$('start').classList.remove('hide')});$('howBtn').addEventListener('click',()=>showToast('Gaz: hızlan • Fren: yavaşla • ◀ ▶: direksiyon'));
rivals=newRivals();applyCars(rivals);resize();startIdle();
})();
</script></body></html>
